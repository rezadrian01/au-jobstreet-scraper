# Konfigurasi scraper. Semua nilai diverifikasi dari request nyata (Oktober 2026).

[search]
classification = 1200      # Accounting
classification_name = "Accounting"
sort_mode = "ListedDate"
page_size = 100
max_pages = 50             # batas pengaman; peringatan muncul jika tercapai
default_daterange = 7      # N hari terakhir; 0 = tanpa filter tanggal

[http]
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
timeout = 30
delay_min = 2.0            # jeda antar request pencarian (detik), dengan jitter acak
delay_max = 5.0
detail_delay_min = 1.5     # jeda antar request deskripsi (1 request per lowongan)
detail_delay_max = 3.0
max_retries = 4            # retry saat 403/429/5xx/error jaringan
backoff_base = 5.0         # detik; dikali 2 tiap retry

# Lokasi memakai nilai `where` situs. Di Seek, "All <kota>" = seluruh wilayah kota;
# "Sydney NSW" saja ditafsirkan sebagai suburb Sydney 2000 + radius 50 km.
[sites.seek_au]
name = "Seek Australia (au.seek.com)"
base_url = "https://au.seek.com"
site_key = "AU-Main"
locale = "en-AU"
country_code = "AU"
timezone = "Australia/Sydney"
locations = [
    "All Sydney NSW",
    "All Melbourne VIC",
    "All Brisbane QLD",
    "All Perth WA",
    "All Adelaide SA",
    "All Canberra ACT",
    "All Australia",
]
default_locations = []     # kosong = seluruh Australia; lokasi dipilih lewat kotak "Cari lokasi"
all_locations_label = "Semua lokasi di Australia"

[sites.jobstreet_id]
name = "JobStreet Indonesia (id.jobstreet.com)"
base_url = "https://id.jobstreet.com"
site_key = "ID-Main"
locale = "en-ID"
country_code = "ID"
timezone = "Asia/Jakarta"
locations = [
    "Jakarta Raya",
    "Jawa Barat",
    "Jawa Timur",
    "Banten",
    "Bali",
    "Surabaya",
    "Bandung",
]
default_locations = []     # kosong = semua kota di Indonesia
all_locations_label = "Semua kota di Indonesia"

# LinkedIn lewat JobSpy (endpoint tamu, tanpa login). Tidak punya subklasifikasi seperti Seek,
# jadi penyaringannya berbasis keyword. Tanggal posting hanya sampai tingkat hari.
[sites.linkedin_id]
name = "LinkedIn Indonesia (linkedin.com)"
type = "linkedin"
jobspy_site = "linkedin"
base_url = "https://www.linkedin.com"
timezone = "Asia/Jakarta"
date_only = true
locations = ["Indonesia"]
default_locations = []     # kosong = seluruh Indonesia
all_locations_label = "Indonesia"
keyword_suggestions = ["audit", "auditor", "internal audit", "external audit"]
default_keywords = ["audit"]
max_results = 300          # default batas hasil per keyword x lokasi (bisa diubah di UI); LinkedIn berhenti di 1.000
batch_size = 25            # hasil per panggilan pencarian; progress bar bergerak tiap batch

# Indeed lewat JobSpy, tanpa login. Hasil pencarian sudah termasuk deskripsi. Berbasis keyword.
[sites.indeed_id]
name = "Indeed Indonesia (id.indeed.com)"
type = "indeed"
jobspy_site = "indeed"
country_indeed = "Indonesia"
base_url = "https://id.indeed.com"
timezone = "Asia/Jakarta"
date_only = true
locations = ["Indonesia"]
default_locations = []     # kosong = seluruh Indonesia
all_locations_label = "Indonesia"
keyword_suggestions = ["audit", "auditor", "internal audit", "external audit"]
default_keywords = ["audit"]
max_results = 300          # default batas hasil per keyword x lokasi (bisa diubah di UI)
batch_size = 50            # hasil per panggilan pencarian; progress bar bergerak tiap batch

# Glints lewat actor Apify (https://apify.com/truefetch/glints-job-listing). Berbayar per hasil
# ($0,005 per lowongan + $0,01 per run), ditagih ke akun Apify pemilik APIFY_TOKEN di .env.
# Glints sendiri mewajibkan login untuk pencarian, jadi tidak diakses langsung.
[sites.glints_id]
name = "Glints Indonesia (glints.com, via Apify)"
type = "glints"
base_url = "https://glints.com"
timezone = "Asia/Jakarta"
actor = "truefetch~glints-job-listing"
country = "Indonesia"
locations = []
default_locations = []     # kosong = semua kota di Indonesia
all_locations_label = "Semua kota di Indonesia"
keyword_suggestions = ["audit", "auditor", "internal audit", "external audit"]
default_keywords = ["audit"]
max_results = 100          # default batas hasil per keyword x lokasi (bisa diubah di UI); menentukan biaya

