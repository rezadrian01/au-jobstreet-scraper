"Analysis & Reporting" = 6143
"Assistant Accountants" = 6142
"Audit - External" = 6144
"Audit - Internal" = 6145
"Bookkeeping & Small Practice Accounting" = 6146
"Business Services & Corporate Advisory" = 6147
"Company Secretaries" = 6148
"Compliance & Risk" = 6149
"Cost Accounting" = 6150
"Financial Accounting & Reporting" = 6151
"Financial Managers & Controllers" = 6152
"Forensic Accounting & Investigation" = 6153
"Insolvency & Corporate Recovery" = 6154
"Inventory & Fixed Assets" = 6155
"Management" = 6156
